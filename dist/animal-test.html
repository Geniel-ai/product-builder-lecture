    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/To6Q_p8IW/";

        let model, maxPredictions;
        let resultDisplay, imageContainer, labelContainer;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            try {
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();
            } catch (e) {
                console.error('Model loading failed:', e);
                const rd = document.getElementById("result-display");
                if (rd) rd.textContent = "모델 로딩에 실패했습니다. 페이지를 새로고침해주세요.";
            }

            resultDisplay = document.getElementById("result-display");
            imageContainer = document.getElementById("image-container");
            labelContainer = document.getElementById("label-container");
        }
        init();

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (!model) {
                alert('모델이 아직 로딩 중입니다. 잠시 후 다시 시도해주세요.');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    imageContainer.innerHTML = '';
                    imageContainer.appendChild(img);
                    predict(img);
                };
            };
            reader.readAsDataURL(file);
        }

        // Attach event listener
        document.getElementById("image-upload").addEventListener("change", handleImageUpload);

        async function predict(imageElement) {
            if (!model) return;
            resultDisplay.textContent = "분석 중...";
            try {
                const prediction = await model.predict(imageElement);
                let highestProbability = 0;
                let predictedClass = "";

                for (let i = 0; i < maxPredictions; i++) {
                    if (prediction[i].probability > highestProbability) {
                        highestProbability = prediction[i].probability;
                        predictedClass = prediction[i].className;
                    }
                }

                if (highestProbability > 0.5) {
                    let typeClass = "";
                    if (predictedClass === "강아지") typeClass = "dog-type";
                    else if (predictedClass === "고양이") typeClass = "cat-type";

                    resultDisplay.innerHTML = '당신은 <span class="' + typeClass + '">' + predictedClass + '상</span>입니다! <br><small style="font-size: 0.8rem; font-weight: normal; opacity: 0.7;">(정확도: ' + Math.round(highestProbability * 100) + '%)</small>';
                } else {
                    resultDisplay.innerHTML = "분석 결과가 불확실합니다. 다른 사진으로 시도해보세요.";
                }
            } catch (e) {
                console.error('Prediction failed:', e);
                resultDisplay.textContent = "분석 중 오류가 발생했습니다. 다시 시도해주세요.";
            }
        }
    </script>
